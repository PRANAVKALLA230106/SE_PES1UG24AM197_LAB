<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="780" viewBox="0 0 1080 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#444" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="780" fill="#ffffff"/>
  <text x="540" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">UML Use-Case Diagram — OpenAPI Mock Server Generator</text>

  <!-- System boundary -->
  <rect x="230" y="60" width="770" height="690" rx="8" fill="#f7f9fc" stroke="#3a4a63" stroke-width="2"/>
  <text x="615" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#3a4a63">OpenAPI Mock Server Generator</text>

  <!-- ===================== ACTORS ===================== -->
  <!-- API Developer -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <circle cx="95" cy="215" r="16" fill="#fdf3e7"/>
    <line x1="95" y1="231" x2="95" y2="278"/>
    <line x1="66" y1="248" x2="124" y2="248"/>
    <line x1="95" y1="278" x2="70" y2="315"/>
    <line x1="95" y1="278" x2="120" y2="315"/>
  </g>
  <text x="95" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">API Developer</text>

  <!-- QA Engineer -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <circle cx="95" cy="565" r="16" fill="#e7f1fd"/>
    <line x1="95" y1="581" x2="95" y2="628"/>
    <line x1="66" y1="598" x2="124" y2="598"/>
    <line x1="95" y1="628" x2="70" y2="665"/>
    <line x1="95" y1="628" x2="120" y2="665"/>
  </g>
  <text x="95" y="688" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">QA Engineer</text>

  <!-- ===================== ASSOCIATIONS (solid) ===================== -->
  <g stroke="#555" stroke-width="1.5">
    <!-- API Developer -> primary use cases -->
    <line x1="128" y1="255" x2="300" y2="130"/>
    <line x1="128" y1="262" x2="300" y2="225"/>
    <line x1="128" y1="278" x2="300" y2="320"/>
    <line x1="128" y1="292" x2="300" y2="415"/>
    <!-- QA Engineer -> use cases -->
    <line x1="128" y1="540" x2="300" y2="435"/>
    <line x1="128" y1="560" x2="300" y2="560"/>
    <line x1="128" y1="580" x2="300" y2="655"/>
  </g>

  <!-- ===================== USE CASES ===================== -->
  <!-- Primary column (x center 400) -->
  <!-- UC1 Import OpenAPI Spec -->
  <ellipse cx="400" cy="130" rx="100" ry="34" fill="#eaf2ff" stroke="#3a4a63" stroke-width="1.6"/>
  <text x="400" y="126" text-anchor="middle" font-size="13" fill="#1a1a1a">Import OpenAPI</text>
  <text x="400" y="143" text-anchor="middle" font-size="13" fill="#1a1a1a">Spec</text>

  <!-- UC2 Generate Mock Endpoints -->
  <ellipse cx="400" cy="225" rx="100" ry="34" fill="#eaf2ff" stroke="#3a4a63" stroke-width="1.6"/>
  <text x="400" y="221" text-anchor="middle" font-size="13" fill="#1a1a1a">Generate Mock</text>
  <text x="400" y="238" text-anchor="middle" font-size="13" fill="#1a1a1a">Endpoints</text>

  <!-- UC3 Configure Custom Responses -->
  <ellipse cx="400" cy="320" rx="100" ry="34" fill="#eaf2ff" stroke="#3a4a63" stroke-width="1.6"/>
  <text x="400" y="316" text-anchor="middle" font-size="13" fill="#1a1a1a">Configure Custom</text>
  <text x="400" y="333" text-anchor="middle" font-size="13" fill="#1a1a1a">Responses</text>

  <!-- UC4 Configure Response Latency (shared) -->
  <ellipse cx="400" cy="425" rx="100" ry="34" fill="#eef7ee" stroke="#3a6340" stroke-width="1.6"/>
  <text x="400" y="421" text-anchor="middle" font-size="13" fill="#1a1a1a">Configure Response</text>
  <text x="400" y="438" text-anchor="middle" font-size="13" fill="#1a1a1a">Latency</text>

  <!-- UC6 Invoke Mock Endpoint -->
  <ellipse cx="400" cy="560" rx="100" ry="34" fill="#eaf2ff" stroke="#3a4a63" stroke-width="1.6"/>
  <text x="400" y="556" text-anchor="middle" font-size="13" fill="#1a1a1a">Invoke Mock</text>
  <text x="400" y="573" text-anchor="middle" font-size="13" fill="#1a1a1a">Endpoint</text>

  <!-- UC7 View Request Logs -->
  <ellipse cx="400" cy="655" rx="100" ry="34" fill="#eaf2ff" stroke="#3a4a63" stroke-width="1.6"/>
  <text x="400" y="651" text-anchor="middle" font-size="13" fill="#1a1a1a">View Request</text>
  <text x="400" y="668" text-anchor="middle" font-size="13" fill="#1a1a1a">Logs</text>

  <!-- Target column (x center 760) -->
  <!-- UC5 Validate Specification (include from UC1) -->
  <ellipse cx="760" cy="130" rx="100" ry="34" fill="#fff4e6" stroke="#9a6b1e" stroke-width="1.6"/>
  <text x="760" y="126" text-anchor="middle" font-size="13" fill="#1a1a1a">Validate</text>
  <text x="760" y="143" text-anchor="middle" font-size="13" fill="#1a1a1a">Specification</text>

  <!-- UC8 Validate Request Schema (include from UC6) -->
  <ellipse cx="760" cy="560" rx="100" ry="34" fill="#fff4e6" stroke="#9a6b1e" stroke-width="1.6"/>
  <text x="760" y="556" text-anchor="middle" font-size="13" fill="#1a1a1a">Validate Request</text>
  <text x="760" y="573" text-anchor="middle" font-size="13" fill="#1a1a1a">Schema</text>

  <!-- UC9 Simulate Response Latency (extend to UC6) -->
  <ellipse cx="760" cy="655" rx="100" ry="34" fill="#f3ecff" stroke="#5a3a9a" stroke-width="1.6"/>
  <text x="760" y="651" text-anchor="middle" font-size="13" fill="#1a1a1a">Simulate Response</text>
  <text x="760" y="668" text-anchor="middle" font-size="13" fill="#1a1a1a">Latency</text>

  <!-- ===================== INCLUDE / EXTEND (dashed) ===================== -->
  <g stroke="#444" stroke-width="1.4" stroke-dasharray="7,5" fill="none">
    <!-- UC1 ..> UC5  <<include>> -->
    <line x1="500" y1="130" x2="655" y2="130" marker-end="url(#arrow)"/>
    <!-- UC6 ..> UC8  <<include>> -->
    <line x1="500" y1="560" x2="655" y2="560" marker-end="url(#arrow)"/>
    <!-- UC9 ..> UC6  <<extend>> (arrow points to base use case) -->
    <line x1="660" y1="648" x2="500" y2="575" marker-end="url(#arrow)"/>
  </g>
  <text x="577" y="122" text-anchor="middle" font-size="12" font-style="italic" fill="#444">&#171;include&#187;</text>
  <text x="577" y="552" text-anchor="middle" font-size="12" font-style="italic" fill="#444">&#171;include&#187;</text>
  <text x="590" y="628" text-anchor="middle" font-size="12" font-style="italic" fill="#444">&#171;extend&#187;</text>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" fill="#333">
    <rect x="250" y="700" width="500" height="38" rx="6" fill="#ffffff" stroke="#ccc"/>
    <line x1="266" y1="713" x2="306" y2="713" stroke="#555" stroke-width="1.5"/>
    <text x="314" y="717">association</text>
    <line x1="410" y1="713" x2="450" y2="713" stroke="#444" stroke-width="1.4" stroke-dasharray="7,5" marker-end="url(#arrow)"/>
    <text x="458" y="717">&#171;include&#187; / &#171;extend&#187; dependency</text>
    <line x1="266" y1="729" x2="306" y2="729" stroke="#3a4a63" stroke-width="2"/>
    <text x="314" y="733">system boundary</text>
  </g>
</svg>
